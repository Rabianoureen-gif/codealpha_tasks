<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="full-image" id="fullImgBox">
        <button type="button" id="prevBtn" aria-label="Previous image">&#10094;</button>
        <img src="images/image1.avif" id="fullImg">
        <button type="button" id="nextBtn" aria-label="Next image">&#10095;</button>
        <span onclick="closefullImg()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-x preview-icon">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg></span>
    </div>
    <main>
        <nav>
            <div class="navhead">
                <h1>Image<span>Gallery</span></h1>
            </div>
            <div class="nav-items">
                <a href="#">Home</a>
                <a href="#gallery">Images</a>
            </div>
        </nav>
        <div class="heroimg">
            <img src="images/hero-image.avif" alt="">
            <div class="hero-content">
                <h1>Captured Moments in Stillness</h1>
                <p>A curated collection of calm landscapes, natural light, and everyday scenes in one clean gallery.</p>
                <a href="#gallery" class="hero-btn">Explore Gallery</a>
            </div>
        </div>


    </main>
    <section class="gallery-section" id="gallery">
        <div class="gallery-header">
    <h1>Visual Collection</h1>
    <p>Quiet landscapes, soft light, and minimalist spaces selected for full-screen viewing.</p>
  </div>
     <div class="image-gallery">
        <img width="300" height="200" src="images/image1.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image2.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image3.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image4.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image5.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image6.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image7.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image8.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image9.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image10.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image11.avif" onclick="openfullImg(this.src)">
        <img width="300" height="200" src="images/image12.avif" onclick="openfullImg(this.src)">
    </div>
    </section>
   
   
    <script>
        var fullImgBox = document.getElementById("fullImgBox");
        var fullImg = document.getElementById("fullImg");
        var galleryImgs = document.querySelectorAll(".image-gallery img");
        var prevBtn = document.getElementById("prevBtn")
        var nextBtn = document.getElementById("nextBtn")
        var currentIndex = 0;

        function openfullImg(pic) {
            fullImgBox.style.display = "flex";
            fullImg.src = pic;
            for (var i = 0; i < galleryImgs.length; i++) {
                if (galleryImgs.length.src === pic) {
                    currentIndex = i
                    break;
                }
            }
        }



        function closefullImg() {
            fullImgBox.style.display = "none";
        }

        prevBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + galleryImgs.length) % galleryImgs.length;
            fullImg.src = galleryImgs[currentIndex].src;
        });

        nextBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % galleryImgs.length;
            fullImg.src = galleryImgs[currentIndex].src;
        });
    </script>
</body>

</html>
